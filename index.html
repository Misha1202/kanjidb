<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Тепловая карта нагрузки (54 ячейки)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181c24;
      --text: #e5e7eb;
      --border: #333;
      
      /* Цвета тепловой карты */
      --color-high: #10b981;       /* Зеленый - Ходовой */
      --color-high-hover: #059669;
      --color-mid: #f59e0b;        /* Желтый - Средний */
      --color-mid-hover: #d97706;
      --color-low: #ef4444;         /* Красный - Низкий */
      --color-low-hover: #dc2626;
      --color-empty: #2c333f;      /* Темно-серый - Пусто */
      --color-divider: #4b5563;    /* Цвет вертикальных полос */
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    h1 { margin: 0; font-size: 22px; }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      color: white;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.98); }

    .btn-primary { background-color: #3b82f6; }
    .btn-success { background-color: #10b981; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

    /* Зона загрузки */
    .drop-zone {
      border: 2px dashed var(--color-divider);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: var(--panel);
      color: #9ca3af;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .drop-zone:hover { border-color: var(--color-high); color: var(--text); }

    /* Настройки */
    .settings {
      background: var(--panel);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    select {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #0f1115;
      color: white;
      min-width: 200px;
    }

    /* СЕТКА ТЕПЛОВОЙ КАРТЫ (6x9) */
    .heatmap-wrapper {
      position: relative;
      overflow-x: auto; /* Горизонтальная прокрутка если экран мал */
      padding: 10px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 800px;
    }

    .heatmap-grid {
      display: grid;
      /* 9 колонок равной ширины */
      grid-template-columns: repeat(9, 1fr);
      /* 6 строк равной высоты */
      grid-template-rows: repeat(6, 1fr);
      gap: 2px;
      width: 100%;
      aspect-ratio: 9 / 6; /* Фиксируем пропорции 9:6 */
    }

    .cell {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      color: rgba(0,0,0,0.8);
      cursor: default;
      user-select: none;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .cell:hover { transform: scale(1.05); z-index: 10; }

    /* Вертикальные разделители (как на вашем фото) */
    .v-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: var(--color-divider);
      opacity: 0.6;
      pointer-events: none;
    }
    /* Позиции разделителей: после 3-й, 6-й, 9-й, 12-й, 15-й, 18-й... колонки */
    /* Но так как у нас Grid, проще сделать это через псевдоэлементы или отдельные блоки. 
       Здесь используем подход с абсолютным позиционированием внутри wrapper для имитации линий между группами */
       
    /* Альтернатива: просто добавим классы для визуального разделения групп по 3 ячейки, 
       но для точного совпадения с фото лучше использовать CSS Grid с gap и цветом фона wrapper */
       
    /* Цвета ячеек */
    .cell.empty {
      background-color: var(--color-empty);
      color: #555;
      box-shadow: none;
    }
    .cell.high { background-color: var(--color-high); }
    .cell.mid { background-color: var(--color-mid); }
    .cell.low { background-color: var(--color-low); }

    .cell-num {
      position: absolute;
      top: 4px;
      left: 4px;
      color: rgba(0,0,0,0.6);
      font-size: 8px;
      font-weight: bold;
      text-shadow: 0 1px 1px rgba(255,255,255,0.7);
    }
    
    .cell-content {
      text-align: center;
      padding: 2px;
      max-width: 90%;
      word-wrap: break-word;
      line-height: 1.1;
    }
    .cell-qty {
      font-size: 11px;
      font-weight: bold;
      margin-top: 2px;
      color: #fff;
      text-shadow: 0 1px 2px black;
    }

    /* Легенда */
    .legend {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .legend-color {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }

    /* Таблица деталей */
    .details-table {
      margin-top: 20px;
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border-radius: 8px;
      overflow: hidden;
    }
    .details-table th {
      background: #111;
      color: #9ca3af;
      padding: 10px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
    }
    .details-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      color: #d1d5db;
    }
    .details-table tr:last-child td { border-bottom: none; }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .stat-box {
      background: var(--panel);
      padding: 8px 16px;
      border-radius: 6px;
      border-left: 3px solid var(--color-high);
    }
    .stat-box strong { color: var(--color-high); }

  </style>
</head>
<body>

<div class="header-bar">
  <h1>Тепловая карта нагрузки (54 ячейки)</h1>
  <div class="controls">
    <button class="btn-outline" onclick="document.getElementById('file-input').click()">📂 Загрузить Excel</button>
    <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this)">
    <button class="btn-success" onclick="exportReport()">💾 Скачать отчет</button>
  </div>
</div>

<div class="drop-zone" onclick="document.getElementById('file-input').click()">
  <p>Перетащите файл Excel сюда</p>
  <p style="font-size: 12px; margin-top: 5px; color: #6b7280;">Формат: Адрес, Квадрат, Кол-во коробок</p>
</div>

<div class="settings">
  <label style="color: #9ca3af; font-weight: 500;">Квадрат:</label>
  <select id="square-select" onchange="renderHeatmap()" disabled>
    <option value="">Загрузка...</option>
  </select>
  
  <div class="stats" id="stats-display" style="display:none;">
    <div class="stat-box">
      <strong id="stat-total">0</strong> ПВЗ
    </div>
    <div class="stat-box" style="border-left-color: var(--color-mid);">
      <strong id="stat-boxes">0</strong> Коробок
    </div>
  </div>
</div>

<!-- ТЕПЛОВАЯ КАРТА -->
<div class="heatmap-wrapper">
  <div class="heatmap-grid" id="heatmap-grid">
    <!-- Ячейки генерируются JS -->
  </div>
  
  <!-- Вертикальные разделители (имитация линий между группами) -->
  <!-- В CSS Grid это сложно сделать идеально между ячейками без изменения структуры, 
       поэтому мы используем абсолютное позиционирование линий поверх сетки -->
  <div class="v-divider" style="left: calc(33.33% + 1px);"></div>
  <div class="v-divider" style="left: calc(66.66% + 2px);"></div>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-color" style="background: var(--color-high);"></div>
    <span>Высокая нагрузка (Ходовой)</span>
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background: var(--color-mid);"></div>
    <span>Средняя нагрузка</span>
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background: var(--color-low);"></div>
    <span>Низкая нагрузка</span>
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background: var(--color-empty);"></div>
    <span>Пусто</span>
  </div>
</div>

<table class="details-table">
  <thead>
    <tr>
      <th>Ячейка №</th>
      <th>Адрес ПВЗ</th>
      <th>Квадрат</th>
      <th>Коробок</th>
      <th>Уровень нагрузки</th>
    </tr>
  </thead>
  <tbody id="table-body">
    <!-- Строки таблицы -->
  </tbody>
</table>

<script>
  let rawData = ;
  let currentSquare = null;

  // Конфигурация уровней (пороги в процентах от макс. нагрузки в квадрате)
  const LEVELS = {
    HIGH_THRESHOLD: 0.7, // Топ 70% от максимума - Зеленый
    MID_THRESHOLD: 0.3  // От 30% до 70% - Желтый
  };

  function handleFile(input) {
    const file = input.files;
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type: 'array'});
      const firstSheetName = workbook.SheetNames;
      const worksheet = workbook.Sheets[firstSheetName];
      const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});

      processExcelData(json);
    };
    reader.readAsArrayBuffer(file);
  }

  function processExcelData(json) {
    if (json.length < 2) {
      alert('Файл пуст');
      return;
    }

    const headers = json.map(h => String(h).toLowerCase().trim());
    
    // Поиск колонок (гибкий)
    const colMap = {};
    headers.forEach((h, i) => {
      if (h.includes('квадрат') || h.includes('место') || h.includes('cs')) colMap.square = i;
      if (h.includes('адрес') || h.includes('офис') || h.includes('pvz')) colMap.address = i;
      if (h.includes('кол') || h.includes('qty') || h.includes('вес') || h.includes('короб')) colMap.qty = i;
    });

    if (!colMap.square || !colMap.address || !colMap.qty) {
      alert('Ошибка: Не найдены обязательные колонки (Квадрат, Адрес, Кол-во).\nНайдено: ' + JSON.stringify(headers));
      return;
    }

    rawData = ;
    for (let i = 1; i < json.length; i++) {
      const row = json[i];
      const square = String(row[colMap.square] || '').trim();
      const address = String(row[colMap.address] || '').trim();
      const qty = parseFloat(row[colMap.qty]) || 0;

      if (!square || !address) continue;

      rawData.push({
        square: square,
        address: address,
        qty: qty
      });
    }

    // Заполняем селектор квадратов
    const uniqueSquares = [...new Set(rawData.map(d => d.square))].sort();
    const select = document.getElementById('square-select');
    select.innerHTML = '';
    uniqueSquares.forEach(sq => {
      const opt = document.createElement('option');
      opt.value = sq;
      opt.textContent = sq;
      select.appendChild(opt);
    });
    
    select.disabled = false;
    currentSquare = uniqueSquares;
    
    // Инициализация пустой сетки (54 ячейки)
    initEmptyGrid();
    
    // Первый расчет
    renderHeatmap();
  }

  // Создаем статичную структуру сетки (пустые ячейки 1-54)
  function initEmptyGrid() {
    const grid = document.getElementById('heatmap-grid');
    grid.innerHTML = '';
    for (let i = 1; i <= 54; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell empty';
      cell.innerHTML = `
        <span class="cell-num">\${i}</span>
        <div class="cell-content">
          <span style="font-size:8px; opacity:0.5;">Нет данных</span>
        </div>
        <div class="cell-qty">0</div>
      `;
      grid.appendChild(cell);
    }
  }

  function renderHeatmap() {
    currentSquare = document.getElementById('square-select').value;
    if (!currentSquare) return;

    // 1. Фильтруем данные ТОЛЬКО для текущего квадрата
    const squareData = rawData.filter(d => d.square === currentSquare);

    // 2. Находим максимальную нагрузку в этом квадрате для нормализации цветов
    const maxQty = squareData.length > 0 ? Math.max(...squareData.map(d => d.qty)) : 1;

    // 3. Сортируем по убыванию (самые тяжелые первыми)
    // ВАЖНО: В тепловой карте мы заполняем ячейки последовательно: 
    // 1-я ячейка = самый тяжелый ПВЗ, 2-я = следующий и т.д.
    squareData.sort((a, b) => b.qty - a.qty);

    // 4. Обновляем визуальную сетку
    const grid = document.getElementById('heatmap-grid');
    const cells = grid.querySelectorAll('.cell');
    
    // Очищаем все ячейки
    cells.forEach(c => {
      c.className = 'cell empty';
      c.querySelector('.cell-content').innerHTML = '<span style="font-size:8px; opacity:0.5;">Пусто</span>';
      c.querySelector('.cell-qty').textContent = '0';
    });

    // Заполняем данными
    squareData.forEach((item, index) => {
      if (index >= 54) return; // Защита от выхода за пределы сетки
      
      const cell = cells[index];
      
      // Определяем цвет на основе веса относительно максимума
      const ratio = item.qty / maxQty;
      let levelClass = 'low';
      let levelText = 'Низкий';

      if (ratio >= LEVELS.HIGH_THRESHOLD) {
        levelClass = 'high';
        levelText = 'Ходовой';
      } else if (ratio >= LEVELS.MID_THRESHOLD) {
        levelClass = 'mid';
        levelText = 'Средний';
      }

      cell.className = `cell \${levelClass}`;
      
      // Обрезаем адрес для красоты
      const shortAddr = item.address.length > 25 ? item.address.substring(0, 22) + '...' : item.address;
      
      cell.querySelector('.cell-content').innerHTML = shortAddr;
      cell.querySelector('.cell-qty').textContent = item.qty;
      
      // Сохраняем данные для таблицы
      cell.dataset.address = item.address;
      cell.dataset.qty = item.qty;
      cell.dataset.level = levelText;
    });

    // 5. Обновляем таблицу деталей
    updateTable(squareData);

    // 6. Обновляем статистику
    const totalBoxes = squareData.reduce((sum, d) => sum + d.qty, 0);
    document.getElementById('stat-total').textContent = squareData.length;
    document.getElementById('stat-boxes').textContent = totalBoxes;
    document.getElementById('stats-display').style.display = 'flex';
  }

  function updateTable(data) {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';
    
    data.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>#\${index + 1}</td>
        <td>\${item.address}</td>
        <td>\${item.square}</td>
        <td>\${item.qty}</td>
        <td>\${item.qty / Math.max(...data.map(d=>d.qty)) >= 0.7 ? '<span style="color:var(--color-high)">Ходовой</span>' : 
               item.qty / Math.max(...data.map(d=>d.qty)) >= 0.3 ? '<span style="color:var(--color-mid)">Средний</span>' : 
               '<span style="color:var(--color-low)">Низкий</span>'}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function exportReport() {
    if (rawData.length === 0) {
      alert('Нет данных для экспорта');
      return;
    }
    
    // Экспорт текущего состояния (с рассчитанными уровнями)
    const wb = XLSX.utils.book_new();
    const wsData = [['Ячейка №', 'Адрес ПВЗ', 'Квадрат', 'Коробок', 'Уровень']];
    
    // Берем данные текущего квадрата
    const exportData = rawData.filter(d => d.square === currentSquare);
    // Сортируем для порядка
    exportData.sort((a,b) => b.qty - a.qty);

    exportData.forEach((d, i) => {
      const max = Math.max(...exportData.map(x=>x.qty));
      const ratio = d.qty / max;
      const lvl = ratio >= 0.7 ? 'Ходовой' : (ratio >= 0.3 ? 'Средний' : 'Низкий');
      wsData.push([i+1, d.address, d.square, d.qty, lvl]);
    });

    const ws = XLSX.utils.aoa_to_sheet(wsData);
    XLSX.utils.book_append_sheet(wb, ws, 'Heatmap_Report');
    XLSX.writeFile(wb, `heatmap_report_\${currentSquare.replace(/[^a-z0-9]/gi,'').substring(0,10)}.xlsx`);
  }
</script>

</body>
</html>
