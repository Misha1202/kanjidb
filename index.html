<script>
  let rawData = [];
  let currentSquare = null;

  const THRESHOLDS = { HIGH: 0.7, MID: 0.3 };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function getLevel(ratio) {
    if (ratio >= THRESHOLDS.HIGH) return { cls: 'high', text: 'Ходовой', badge: 'badge-high' };
    if (ratio >= THRESHOLDS.MID)  return { cls: 'mid',  text: 'Средний', badge: 'badge-mid' };
    return { cls: 'low', text: 'Низкий', badge: 'badge-low' };
  }

  // --- Инициализация ---
  function init() {
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile({ files: e.dataTransfer.files });
    });

    const grid = document.getElementById('heatmap-grid');
    grid.innerHTML = '';
    for (let i = 1; i <= 54; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = `
        <span class="cell-num">${i}</span>
        <div class="cell-qty">0</div>
        <div class="cell-addr">Нет данных</div>
      `;
      grid.appendChild(cell);
    }
  }
  init();

  // --- Обработка файла ---
  function handleFile(input) {
    const file = input.files && input.files[0];
    if (!file) return;

    document.getElementById('btn-export').disabled = true;

    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
        processExcelData(json);
      } catch (err) {
        alert('Не удалось прочитать файл: ' + err.message);
      }
    };
    reader.onerror = () => alert('Ошибка чтения файла');
    reader.readAsArrayBuffer(file);

    // чтобы можно было загрузить тот же файл повторно
    if (input.value !== undefined) input.value = '';
  }

  function processExcelData(json) {
    if (json.length < 2) {
      alert('Файл пуст или не содержит данных');
      return;
    }

    const headers = json[0].map(h => String(h ?? '').toLowerCase().trim());
    const colMap = {};

    headers.forEach((h, i) => {
      if (colMap.square  === undefined && (h.includes('квадрат') || h.includes('место') || h.includes('cs'))) colMap.square = i;
      if (colMap.address === undefined && (h.includes('адрес') || h.includes('офис') || h.includes('pvz'))) colMap.address = i;
      if (colMap.qty     === undefined && (h.includes('кол') || h.includes('qty') || h.includes('вес') || h.includes('короб'))) colMap.qty = i;
    });

    if (colMap.square === undefined || colMap.address === undefined || colMap.qty === undefined) {
      alert('Ошибка: не найдены обязательные колонки.\nНайдено: ' + JSON.stringify(headers));
      return;
    }

    rawData = [];
    for (let i = 1; i < json.length; i++) {
      const row = json[i];
      if (!row) continue;
      const square  = String(row[colMap.square]  ?? '').trim();
      const address = String(row[colMap.address] ?? '').trim();
      const qty = parseFloat(String(row[colMap.qty]).replace(',', '.')) || 0;

      if (!square || !address) continue;
      rawData.push({ square, address, qty });
    }

    if (rawData.length === 0) {
      alert('Не найдено ни одной валидной строки');
      return;
    }

    const uniqueSquares = [...new Set(rawData.map(d => d.square))].sort();
    const select = document.getElementById('square-select');
    select.innerHTML = '';
    uniqueSquares.forEach(sq => {
      const opt = document.createElement('option');
      opt.value = sq;
      opt.textContent = sq;
      select.appendChild(opt);
    });

    select.disabled = false;
    select.value = uniqueSquares[0];
    currentSquare = uniqueSquares[0];

    renderHeatmap();
    document.getElementById('btn-export').disabled = false;
  }

  // --- Рендер тепловой карты ---
  function renderHeatmap() {
    currentSquare = document.getElementById('square-select').value;
    if (!currentSquare) return;

    const squareData = rawData.filter(d => d.square === currentSquare);
    if (squareData.length === 0) {
      alert('Нет данных для этого квадрата');
      return;
    }

    const maxQty = Math.max(...squareData.map(d => d.qty)) || 1;
    squareData.sort((a, b) => b.qty - a.qty);

    const cells = document.querySelectorAll('#heatmap-grid .cell');
    cells.forEach(c => {
      c.className = 'cell';
      c.querySelector('.cell-qty').textContent = '0';
      c.querySelector('.cell-addr').textContent = 'Нет данных';
      c.removeAttribute('title');
    });

    squareData.forEach((item, index) => {
      if (index >= 54) return;
      const cell = cells[index];
      const lvl = getLevel(item.qty / maxQty);

      cell.classList.add(lvl.cls);
      cell.querySelector('.cell-qty').textContent = item.qty;
      cell.querySelector('.cell-addr').textContent =
        item.address.length > 20 ? item.address.substring(0, 18) + '...' : item.address;
      cell.title = `${item.address} — ${item.qty} (${lvl.text})`;
    });

    updateTable(squareData, maxQty);

    const totalBoxes = squareData.reduce((sum, d) => sum + d.qty, 0);
    document.getElementById('stat-total').textContent = squareData.length;
    document.getElementById('stat-boxes').textContent = totalBoxes;
    document.getElementById('stat-avg').textContent = Math.round(totalBoxes / squareData.length);
  }

  function updateTable(data, maxQty) {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    data.forEach((item, index) => {
      const lvl = getLevel(item.qty / maxQty);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td>${esc(item.address)}</td>
        <td>${esc(item.square)}</td>
        <td>${item.qty}</td>
        <td><span class="status-badge ${lvl.badge}">${lvl.text}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- Экспорт ---
  function exportReport() {
    if (!rawData.length) return;

    const exportData = rawData.filter(d => d.square === currentSquare);
    exportData.sort((a, b) => b.qty - a.qty);
    const max = Math.max(...exportData.map(x => x.qty)) || 1;

    const wsData = [['Ячейка №', 'Адрес ПВЗ', 'Квадрат', 'Коробок', 'Уровень']];
    exportData.forEach((d, i) => {
      wsData.push([i + 1, d.address, d.square, d.qty, getLevel(d.qty / max).text]);
    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsData), 'Heatmap_Report');
    const safeName = currentSquare.replace(/[^\wа-яё]/gi, '').substring(0, 20) || 'report';
    XLSX.writeFile(wb, `heatmap_report_${safeName}.xlsx`);
  }
</script>
